name: Release

# Cut a release by pushing a semver tag:
#   git tag v1.2.3 && git push origin v1.2.3
#
# This builds the distributable artifacts, stamps them with the tag version, optionally Authenticode-signs
# the Windows installer via Azure Artifact Signing, and publishes a GitHub Release with:
#   - DispatchSetup.exe          the single-file Windows installer (embeds the signed MSI; installs the
#                                self-contained service, which defaults to bundled SQLite)
#   - dispatch-<ver>-linux.tar.gz       universal Linux bundle (x64 + arm64, self-contained)
#   - dispatch-<ver>-macos.dmg          ONE file for macOS: DispatchRelay.app, a menu bar control panel that
#                                installs the launchd daemon for you (Apple Silicon, self-contained; no .NET
#                                SDK and no Node required on the box)
#   - SHA256SUMS                 checksums for all of the above
#
# Code signing is OPT-IN and dormant until you provision Azure Artifact Signing (renamed from Trusted
# Signing, Jan 2026) and set these repo settings:
#   Variables: AZURE_SIGNING_ENDPOINT (e.g. https://eus.codesigning.azure.net/),
#              AZURE_SIGNING_ACCOUNT, AZURE_CERT_PROFILE
#   Secrets:   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID   (federated/OIDC service principal)
# Until AZURE_SIGNING_ACCOUNT is set, the release still publishes - just unsigned.

on:
  push:
    tags:
      - "v*"
  # Allow a dry run against the current ref without tagging (publishes a draft prerelease).
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a manual dry-run build (e.g. 0.0.0-test)"
        type: string
        default: "0.0.0-dryrun"

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # Azure OIDC login for signing
  packages: write   # push the container image to GHCR

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="${{ inputs.version }}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building version $v"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/Dispatch.UI/package-lock.json

      - name: Build + embed the web UI
        shell: pwsh
        run: |
          Push-Location src/Dispatch.UI; npm ci; npm run build; Pop-Location
          Remove-Item -Recurse -Force src/Dispatch.Web/wwwroot -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force src/Dispatch.Web/wwwroot | Out-Null
          Copy-Item -Recurse -Force src/Dispatch.UI/dist/* src/Dispatch.Web/wwwroot/
          if (-not (Test-Path src/Dispatch.Web/wwwroot/index.html)) { throw "embedded UI missing index.html" }

      - name: Publish the service
        # Self-contained: bundle the .NET runtime so the service runs on a clean Windows box without a
        # separately-installed .NET 10 runtime (the bundle does not chain one). Matches the Linux build.
        run: dotnet publish src/Dispatch.Service -c Release -r win-x64 --self-contained true -p:Version=${{ steps.ver.outputs.version }} -o installer/windows/publish

      - name: Install the WiX toolset
        shell: pwsh
        env:
          WIX_VERSION: "6.0.2"
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          wix extension add -g "WixToolset.Firewall.wixext/$env:WIX_VERSION"
          wix extension add -g "WixToolset.BootstrapperApplications.wixext/$env:WIX_VERSION"
          wix extension add -g "WixToolset.Util.wixext/$env:WIX_VERSION"

      - name: Build the MSI
        working-directory: installer/windows
        run: wix build Dispatch.wxs -arch x64 -d PublishDir=publish -d Version=${{ steps.ver.outputs.version }} -ext WixToolset.Firewall.wixext -o Dispatch.msi

      # --- Sign the MSI (opt-in) ----------------------------------------------------------------
      - name: Azure login (signing)
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the MSI
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}/installer/windows
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build the bundle
        working-directory: installer/windows
        shell: pwsh
        run: |
          wix build bundle/Bundle.wxs -d Version=${{ steps.ver.outputs.version }} `
            -ext WixToolset.BootstrapperApplications.wixext -ext WixToolset.Util.wixext `
            -bindpath "Msi=." -o DispatchSetup.exe

      # --- Sign the Burn bundle (opt-in) --------------------------------------------------------
      # A Burn bundle has an attached engine; the engine must be signed too, so detach it, sign it,
      # reattach, then sign the final bundle (WiX-recommended; otherwise UAC flags the inner engine).
      # installer/windows holds other .exe files (publish/), so each Azure sign step
      # targets a folder containing ONLY the one file to sign, and we copy the result back in place.
      - name: Detach the bundle engine
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        working-directory: installer/windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force engine | Out-Null
          wix burn detach DispatchSetup.exe -engine engine/engine.exe

      - name: Sign the engine
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}/installer/windows/engine
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Reattach the signed engine + stage bundle for signing
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        working-directory: installer/windows
        shell: pwsh
        run: |
          wix burn reattach DispatchSetup.exe -engine engine/engine.exe -o DispatchSetup.exe
          New-Item -ItemType Directory -Force bundlesign | Out-Null
          Copy-Item -Force DispatchSetup.exe bundlesign/DispatchSetup.exe

      - name: Sign the bundle
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}/installer/windows/bundlesign
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Put the signed bundle back in place
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        working-directory: installer/windows
        shell: pwsh
        run: Copy-Item -Force bundlesign/DispatchSetup.exe DispatchSetup.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows
          # DispatchSetup.exe is the single distributable - it embeds the (signed) MSI.
          path: installer/windows/DispatchSetup.exe
          if-no-files-found: error
          retention-days: 3

  # The upgrade package (built in the linux job) carries every platform's payload, and it is signed once,
  # there. So linux needs macos: the osx payload tarballs are produced on a macOS runner and downloaded in.
  linux:
    needs: macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="${{ inputs.version }}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/Dispatch.UI/package-lock.json

      - name: Build + embed the web UI
        run: |
          ( cd src/Dispatch.UI && npm ci && npm run build )
          rm -rf src/Dispatch.Web/wwwroot
          mkdir -p src/Dispatch.Web/wwwroot
          cp -r src/Dispatch.UI/dist/* src/Dispatch.Web/wwwroot/
          test -f src/Dispatch.Web/wwwroot/index.html || { echo "embedded UI missing index.html"; exit 1; }

      - name: Publish self-contained (linux-x64 + linux-arm64 + win-x64)
        run: |
          v=${{ steps.ver.outputs.version }}
          dotnet publish src/Dispatch.Service -c Release -r linux-x64   --self-contained true -p:Version=$v -o publish/x64
          dotnet publish src/Dispatch.Service -c Release -r linux-arm64 --self-contained true -p:Version=$v -o publish/arm64
          # win-x64 cross-published on Linux - the self-contained Windows payload for the one upgrade package.
          dotnet publish src/Dispatch.Service -c Release -r win-x64     --self-contained true -p:Version=$v -o publish/win
          # Stamp the version so install.sh names the release dir (/opt/dispatch/releases/<ver>).
          for d in x64 arm64 win; do echo "$v" > "publish/$d/.dispatch-version"; done

      - name: Assemble the universal Linux tarball
        run: |
          ver="${{ steps.ver.outputs.version }}"
          stage="dispatch-${ver}-linux"
          mkdir -p "staging/${stage}/bin-x64" "staging/${stage}/bin-arm64"
          cp -r publish/x64/.   "staging/${stage}/bin-x64/"
          cp -r publish/arm64/. "staging/${stage}/bin-arm64/"
          cp installer/linux/install.sh installer/linux/dispatch.service \
             installer/linux/dispatch-updater.service installer/linux/dispatch-update.path \
             installer/linux/dispatch-update.sh "staging/${stage}/"
          cp src/Dispatch.Core/Updates/dispatch-update-public.pem "staging/${stage}/"
          chmod +x "staging/${stage}/install.sh" "staging/${stage}/dispatch-update.sh" \
            "staging/${stage}/bin-x64/Dispatch.Service" "staging/${stage}/bin-arm64/Dispatch.Service"
          cat > "staging/${stage}/README.txt" <<EOF
          Dispatch SMTP Relay ${ver} - Linux (universal: x64 + arm64, self-contained; no .NET SDK required).

          install.sh auto-detects your CPU arch (uses bin-x64 or bin-arm64) - no flags needed:
            sudo ./install.sh --admin-password '<DashboardPassword!>'

          Or use an existing PostgreSQL server:
            sudo ./install.sh --sql-connection 'Host=...;Port=5432;Database=DispatchLog;Username=...;Password=...' --admin-password '<DashboardPassword!>'

          Then open https://localhost:8420 (self-signed cert) and log in with the admin password you set.
          EOF
          tar -czf "${stage}.tar.gz" -C staging "${stage}"
          ls -lh "${stage}.tar.gz"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dispatch-*-linux.tar.gz
          if-no-files-found: error
          retention-days: 3

      # The macOS job runs on Apple hardware (for codesign), so its payload arrives as an artifact.
      - name: Download macOS payloads
        uses: actions/download-artifact@v8
        with:
          name: macos-payloads
          path: pkg

      # ONE cross-platform upgrade package for web-UI self-update: every platform's self-contained payload
      # (linux-x64, linux-arm64, osx-arm64, win-x64) plus a single signed manifest, in one .tar.gz.
      # A host uploads this one file; the updater picks + applies the payload matching its arch and verifies
      # its sha256. The arch keys must match UpdateService.CurrentArch.
      # The manifest signature is checked against the embedded public key. Signing is gated on the secret;
      # without it the package is unsigned and the app/updater refuse it.
      - name: Build + sign the upgrade package
        env:
          SIGNING_KEY: ${{ secrets.DISPATCH_UPDATE_SIGNING_KEY }}
        run: |
          ver="${{ steps.ver.outputs.version }}"
          built="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          notes="https://github.com/${{ github.repository }}/releases/tag/v${ver}"
          mkdir -p pkg
          tar -czf pkg/linux-x64.tar.gz   -C publish/x64 .
          tar -czf pkg/linux-arm64.tar.gz -C publish/arm64 .
          ( cd publish/win && zip -qr - . ) > pkg/win-x64.zip
          shx="$(sha256sum pkg/linux-x64.tar.gz   | awk '{print $1}')"
          sha="$(sha256sum pkg/linux-arm64.tar.gz | awk '{print $1}')"
          shw="$(sha256sum pkg/win-x64.zip        | awk '{print $1}')"
          sha_osx_arm="$(sha256sum pkg/osx-arm64.tar.gz | awk '{print $1}')"
          printf '{"name":"dispatch","version":"%s","minFromVersion":"0.0.0","builtAt":"%s","notesUrl":"%s","artifacts":{"linux-x64":{"file":"linux-x64.tar.gz","sha256":"%s"},"linux-arm64":{"file":"linux-arm64.tar.gz","sha256":"%s"},"osx-arm64":{"file":"osx-arm64.tar.gz","sha256":"%s"},"win-x64":{"file":"win-x64.zip","sha256":"%s"}}}\n' \
            "$ver" "$built" "$notes" "$shx" "$sha" "$sha_osx_arm" "$shw" > pkg/manifest.json
          if [ -n "$SIGNING_KEY" ]; then
            keyfile="$(mktemp)"; printf '%s' "$SIGNING_KEY" > "$keyfile"
            openssl dgst -sha256 -sign "$keyfile" -out pkg/manifest.json.sig pkg/manifest.json
            # Self-check: the signature must verify against the committed public key before we ship it.
            openssl dgst -sha256 -verify src/Dispatch.Core/Updates/dispatch-update-public.pem -signature pkg/manifest.json.sig pkg/manifest.json
            rm -f "$keyfile"
          else
            echo "::error::DISPATCH_UPDATE_SIGNING_KEY is not set - refusing to publish an unsigned upgrade package (it would be rejected by every installer anyway). Set the signing-key secret to cut a release."
            exit 1
          fi
          tar -czf "dispatch-upgrade-${ver}.tar.gz" -C pkg manifest.json manifest.json.sig \
            linux-x64.tar.gz linux-arm64.tar.gz osx-arm64.tar.gz win-x64.zip

          # The manifest is a promise; prove the package keeps it. Every arch key must match what
          # UpdateService.CurrentArch will ask for, the file it names must exist in the tarball, and its
          # sha256 must match. A host checks the signature, finds its arch entry, then needs the file - an
          # advertised-but-absent payload reads to the operator as "valid package, nothing to install", and
          # nothing else in this pipeline would notice.
          verify="$(mktemp -d)"
          tar -xzf "dispatch-upgrade-${ver}.tar.gz" -C "$verify"
          for arch in linux-x64 linux-arm64 osx-arm64 win-x64; do
            entry="$(tr -d ' \n' < "$verify/manifest.json" | grep -o "\"$arch\":{[^}]*}")"
            [ -n "$entry" ] || { echo "::error::manifest has no $arch entry"; exit 1; }
            file="$(printf '%s' "$entry" | grep -o '"file":"[^"]*"' | cut -d'"' -f4)"
            want="$(printf '%s' "$entry" | grep -o '"sha256":"[^"]*"' | cut -d'"' -f4)"
            [ -f "$verify/$file" ] || { echo "::error::$arch names $file but the package does not contain it"; exit 1; }
            got="$(sha256sum "$verify/$file" | awk '{print $1}')"
            [ "$want" = "$got" ] || { echo "::error::$arch payload $file does not match the manifest sha256"; exit 1; }
            printf 'package ok: %-12s %s (%s MB)\n' "$arch" "$file" "$(( $(stat -c %s "$verify/$file") / 1000000 ))"
          done
          rm -rf "$verify"
          ls -lh "dispatch-upgrade-${ver}.tar.gz"

      - name: Upload upgrade package
        uses: actions/upload-artifact@v7
        with:
          name: upgrade-package
          path: dispatch-upgrade-*.tar.gz
          if-no-files-found: error
          retention-days: 3

  # macOS bundle: the one file a Mac user downloads, self-contained and Apple Silicon only, run as a launchd
  # LaunchDaemon. Built on a macOS runner rather than cross-published from Linux for one reason: the code
  # signature. Apple Silicon will not exec an unsigned Mach-O, and the apphost is the one binary the build
  # patches after the runtime pack was signed, so the seal has to be checked (and if necessary re-made
  # ad-hoc) with Apple's own tool. macOS minutes are free on a public repo.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="${{ inputs.version }}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building version $v"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/Dispatch.UI/package-lock.json

      - name: Build + embed the web UI
        shell: bash
        run: |
          ( cd src/Dispatch.UI && npm ci && npm run build )
          rm -rf src/Dispatch.Web/wwwroot
          mkdir -p src/Dispatch.Web/wwwroot
          cp -R src/Dispatch.UI/dist/. src/Dispatch.Web/wwwroot/
          test -f src/Dispatch.Web/wwwroot/index.html || { echo "embedded UI missing index.html"; exit 1; }

      - name: Publish self-contained (osx-arm64)
        shell: bash
        run: |
          v=${{ steps.ver.outputs.version }}
          # Apple Silicon only, which is now a product decision rather than a packaging shortcut: one macOS
          # file, and no "which bin-<arch> does this Mac want" branch left in the install path. An Intel Mac
          # asks the updater for osx-x64, finds no such manifest key, and is refused by name - a better
          # outcome than a silent wrong-architecture install, and the reason the manifest and the package
          # contents are asserted against each other in the linux job.
          dotnet publish src/Dispatch.Service -c Release -r osx-arm64 --self-contained true -p:Version=$v -o publish/arm64
          # Stamp the version so install.sh names the release dir (/opt/dispatch/releases/<ver>).
          echo "$v" > publish/arm64/.dispatch-version

      - name: Assert self-contained, and signed on every binary we ship
        shell: bash
        run: |
          set -uo pipefail
          for d in arm64; do
            # A framework-dependent regression would still "work" on a runner that has the SDK installed,
            # so assert the runtime is actually bundled (this is what a customer's clean Mac gets).
            for f in libcoreclr.dylib libhostfxr.dylib System.Private.CoreLib.dll libe_sqlite3.dylib; do
              test -f "publish/$d/$f" || { echo "::error::publish/$d is not self-contained (missing $f)"; exit 1; }
            done
            if ! codesign --verify "publish/$d/Dispatch.Service" 2>/dev/null; then
              echo "publish/$d apphost has no valid signature - sealing it ad-hoc"
              codesign --force --sign - "publish/$d/Dispatch.Service"
              codesign --verify "publish/$d/Dispatch.Service" \
                || { echo "::error::could not produce a valid code signature for publish/$d"; exit 1; }
            fi
            echo "OK: publish/$d is self-contained and signed"
          done

      # The two payload archives that go INSIDE the cross-platform upgrade package. Named exactly
      # osx-<arch>.tar.gz because that is the key the manifest uses and UpdateService.CurrentArch looks up.
      - name: Build the upgrade payloads
        shell: bash
        run: |
          tar -czf osx-arm64.tar.gz -C publish/arm64 .
          ls -lh osx-*.tar.gz

      # Everything the .app needs, staged in the layout build-app.sh expects. There is deliberately no
      # tarball and no .pkg any more: one macOS file, like every other Mac product. The staging directory
      # still exists because it is what CI installs on (and what the app embeds), and because the headless
      # route people want over SSH is mounting the dmg and running the install.sh inside it - documented in
      # the README the bundle carries, which is written here rather than committed so it can name the
      # version.
      - name: Stage the macOS payload
        shell: bash
        run: |
          ver="${{ steps.ver.outputs.version }}"
          stage="dispatch-${ver}-macos"
          mkdir -p "staging/${stage}/bin-arm64"
          cp -R publish/arm64/. "staging/${stage}/bin-arm64/"
          cp installer/macos/install.sh installer/macos/dispatch-update.sh \
             installer/macos/app.dispatchrelay.dispatch.plist \
             installer/macos/app.dispatchrelay.dispatch-update.plist "staging/${stage}/"
          cp src/Dispatch.Core/Updates/dispatch-update-public.pem "staging/${stage}/"
          chmod +x "staging/${stage}/install.sh" "staging/${stage}/dispatch-update.sh" \
            "staging/${stage}/bin-arm64/Dispatch.Service"
          cat > "staging/${stage}/README.txt" <<EOF
          Dispatch SMTP Relay ${ver} - macOS (Apple Silicon, self-contained: no .NET SDK, no Node, and no
          database server needed on the box).

          THE NORMAL WAY

          1. Open dispatch-${ver}-macos.dmg and drag DispatchRelay.app to Applications.
          2. Launch it once. It is signed ad-hoc rather than notarized with an Apple Developer ID, so a
             download from a browser is quarantined and Gatekeeper refuses the first open: right-click the
             app, choose Open, then confirm. (From a terminal: xattr -dr com.apple.quarantine
             "/Applications/DispatchRelay.app")
          3. Click the menu bar item and choose "Install background service". Enter your password once.
          4. Choose "Open Dashboard" (https://localhost:8420, self-signed cert) and set the admin password
             on the first-run screen.

          The app is not the relay. The relay is a launchd daemon that starts at boot, before anyone logs in,
          and runs as root because macOS has no way to let an ordinary process bind SMTP port 25. The app is
          the part you can see: whether the daemon is running, a way to open the dashboard, and
          Install/Remove buttons. Quitting it does not stop mail. Launch it again from the menu bar any time;
          there is no Dock icon.

          THE HEADLESS WAY (over SSH, or a Mac with no logged-in user)

          Mount the same file and run the installer inside it directly:

            hdiutil attach dispatch-${ver}-macos.dmg -nobrowse
            sudo /Volumes/Dispatch*/DispatchRelay.app/Contents/Resources/payload/install.sh \
                 --admin-password '<DashboardPassword!>'
            hdiutil detach "/Volumes/Dispatch*"

          Against an existing PostgreSQL/MariaDB/SQL Server instead of the bundled SQLite:

            sudo .../install.sh --sql-connection 'Host=...;Database=DispatchLog;Username=...;Password=...' \
                 --admin-password '<DashboardPassword!>'

          To run the daemon unprivileged, create a service account and pass it:

            sudo dscl . -create /Users/_dispatch UniqueID 451
            sudo dscl . -create /Users/_dispatch PrimaryGroupID -2
            sudo dscl . -create /Users/_dispatch Shell /usr/bin/false
            sudo dscl . -create /Users/_dispatch IsHidden 1
            sudo .../install.sh --user _dispatch --admin-password '<DashboardPassword!>'

          An unprivileged daemon cannot bind 25/587, so SMTP listens on 2525 instead - the same fallback it
          uses on Linux when CAP_NET_BIND_SERVICE is missing. Nothing else changes, and the updater helper
          still runs as root because it has to write under /opt/dispatch.

          CHECKING ON IT

            Status:      sudo launchctl print system/app.dispatchrelay.dispatch
            Logs:        /var/log/dispatch
            Dashboard:   https://localhost:8420
            Updates:     the dashboard's Updates page takes dispatch-upgrade-<version>.tar.gz

          UNINSTALL

            sudo /opt/dispatch/install.sh --uninstall

          That removes the daemons and the program files and KEEPS your database, config and encryption key
          on purpose - deleting an operator's mail history is not a side effect "uninstall" should have. Then
          drag DispatchRelay.app to the Trash. Wipe the data too, only once you are sure:

            sudo rm -rf /var/db/dispatch /var/log/dispatch

          Keep /var/db/dispatch/.dispatch-key if you ever plan to reinstall: the stored provider secrets are
          encrypted with it and cannot be read without it.

          Checksums: SHA256SUMS next to this file, or: shasum -a 256 -c SHA256SUMS

          Intel Macs are not supported by this build. An Intel host will be refused by name rather than sent
          the wrong binaries; the command-line installer still works there, but nothing is published for it.
          Docs: https://docs.dispatchrelay.app
          EOF

      # Built by the same script the Installers workflow installs for real on every push, so the file
      # attached to a release is a file CI has actually booted a service with.
      - name: Build the macOS .app and .dmg
        shell: bash
        run: |
          set -uo pipefail
          ver="${{ steps.ver.outputs.version }}"
          bash installer/macos/build-app.sh "staging/dispatch-${ver}-macos" "$ver" "dispatch-${ver}-macos.dmg"
          ls -lh dispatch-*-macos.dmg
          # Ad-hoc, not notarized: the runners have no Developer ID identity, so this is the honest state of
          # the artifact on every release and the README above carries the matching instruction. || true
          # because codesign reports an ad-hoc signature by exiting non-zero on --check-notarization, and
          # GitHub runs the step under bash -e.
          codesign -dv "dispatch-${ver}-macos.dmg" 2>&1 | grep -i "signature" | head -2 || true

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dispatch-*-macos.dmg
          if-no-files-found: error
          retention-days: 3

      - name: Upload macOS upgrade payloads
        uses: actions/upload-artifact@v7
        with:
          name: macos-payloads
          path: osx-*.tar.gz
          if-no-files-found: error
          retention-days: 3

  # Build + push the multi-arch container image (linux/amd64 + linux/arm64) to GHCR. One image tag
  # serves both architectures; `docker pull ghcr.io/<owner>/dispatch-smtp-relay:<ver>` works on any host.
  # Only runs for real tag releases (a dry-run workflow_dispatch skips the push).
  docker:
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU (cross-arch emulation)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # full semver + major.minor; `latest` only for stable (non-prerelease) tags.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build + push multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Stage release files + checksums
        env:
          VER: ${{ needs.windows.outputs.version }}
        run: |
          mkdir -p release
          # Version the Windows asset names so each release's downloads are distinguishable
          # (the Linux tarball already carries the version). Names match the README.
          cp "dist/windows/DispatchSetup.exe" "release/DispatchSetup-${VER}-x64.exe"
          cp dist/linux/dispatch-*-linux.tar.gz release/
          cp dist/macos/dispatch-*-macos.dmg release/
          cp dist/upgrade-package/* release/          # the single cross-platform upgrade package
          ( cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.windows.outputs.version) }}
          name: Dispatch ${{ needs.windows.outputs.version }}
          draft: ${{ github.ref_type != 'tag' }}
          prerelease: ${{ contains(needs.windows.outputs.version, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Everything the staging step put in release/, rather than a second list of artifact names. The
          # explicit list is how dispatch-<ver>-macos.dmg got built, checksummed into SHA256SUMS, and then
          # silently left out of the release: fail_on_unmatched_files only complains when a PATTERN matches
          # nothing, so a pattern that was never written down is invisible. The staging step is the manifest.
          files: |
            release/*
